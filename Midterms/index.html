<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <title>MarsLente</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="assets/images/mars-rover.png" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="assets/style.css" />
  </head>

  <body>
    <header>
      <nav class="navbar container-fluid">
        <div class="px-3 d-flex flex-row align-items-center">
          <a class="p-2" href="#">Home</a>
          <a class="p-2" href="#">Search</a>
        </div>
      </nav>
    </header>
    <section class="hero-parallax">
      <div class="container">
        <div class="row">
          <div class="col-6">
            <div class="h4" id="hero-heading">Mars Lente</div>
            <p id="hero-text">
              Want to know what the rovers saw in Mars during your most recent
              Birthday?
            </p>
          </div>
          <div class="col-6">
            <div
              class="card h-100 px-4 d-flex justify-content-center"
              id="hero-card"
            >
              <div class="h4" id="enter-text">Enter Your Birthday Here</div>
              <form
                class="row"
                onsubmit="
                  pageRedirect();
                "
              >
                <div class="col-10">
                  <input type="date" class="form-control" id="bDayDate" />
                </div>
                <div class="col-2 p-0">
                  <button
                    type="button"
                    class="btn btn-primary mb-3 w-100"
                    onclick="pageRedirect()"
                  >
                    Search
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>
    <div class="container pt-3 px-0" id="">
      <div class="row" id="parentBday"></div>
    </div>
    <div class="container pt-3 px-0 mb-1">
      <div class="h1">Latest Photo</div>
      <div class="row" id="parentLatest">
        <div class="h3 my-3" id="name">
          <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
      </div>
    </div>
    <footer></footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="assets/script.js"></script>
  </body>
</html>
